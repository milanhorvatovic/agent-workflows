# Starter: trigger for a workflow entry point.
# kind defaults to manual; interval carries `every`, cron carries `cron` —
# each valid only for its own kind, never both (spec §9.3).
# `until` stops a recurring trigger when the command's output equals the value.
protocol: "0.1"
trigger:
  kind: interval
  every: 5m
  until:
    command: "gh pr view --json state -q .state"
    equals: MERGED
