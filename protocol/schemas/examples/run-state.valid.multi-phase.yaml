# Starter: a multi-phase run mid-way through phase 2.
# `run.phase` says which phase is executing, which step records cannot: their
# ids repeat per phase, so this is what a resume reads to know that
# `{run}/phase-{N}-plan.md` resolves to phase 2 and that plan-validate's
# `iterations` counts against phase 2's loop (spec §10, §9.2).
run:
  id: 2026-08-11-feature-slug
  workflow: feature
  phase: 2
  risk: R3
  risk_rationale: "multi-phase, migration touches released API surface"
  protocol: "0.1"
steps:
  - id: plan-create
    status: done
  - id: plan-validate
    status: done
    iterations: 1 # phase 2's loop; phase 1's count did not carry forward
    stall_flags: []
  - id: plan-approval
    status: blocked
gates:
  - gate: plan-approval
    transport: blocking
    outcome: accept
    at: "2026-08-11T09:15:00Z"
artifacts:
  - "{run}/brief.md"
  - "{run}/phase-1-plan.md"
  - "{run}/phase-2-plan.md"
