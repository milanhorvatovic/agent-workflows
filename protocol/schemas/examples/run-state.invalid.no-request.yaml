  workflow: feature
  protocol: "0.2"
steps:
  - id: brief-confirm
    status: done
  - id: clarifying-question
    status: skipped
  - id: risk-route
    status: done
  - id: intake-approval
    status: blocked
gates: []
artifacts:
  - "{run}/brief.md"
