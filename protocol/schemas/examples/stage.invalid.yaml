# INVALID on purpose — schema validation MUST reject this fixture:
# - sequence[0] names both a step and a gate: a member is exactly one of the
#   two, and a record that is both has no single population rule (spec §9.4)
# - sequence[1].conditional is false: absence is the default form, so the
#   noise form is not admitted (spec §9.4)
protocol: "0.2"
stage:
  sequence:
    - step: plan-create
      gate: plan-approval
    - step: plan-validate
      conditional: false
