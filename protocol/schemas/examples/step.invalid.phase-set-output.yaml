# Deliberately broken: an output declared with {P}.
# {P} resolves to one path per phase the manifest records the artifact for, and
# a step produces one artifact — a phase-set of outputs is a stage that repeats
# rather than a step that fans out. One fault, so this fixture proves that rule
# and nothing else (spec §8.1, §9.1).
protocol: "0.3"
step:
  role: implementer
  inputs:
    - artifact: "{run}/phase-{N}-plan.md"
      required: true
  output:
    artifact: "{run}/phase-{P}-impl-log.md"
