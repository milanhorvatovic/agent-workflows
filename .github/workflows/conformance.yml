name: conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Scaffold sanity
        run: |
          test -f AGENTS.md
          [ ! -L CLAUDE.md ]
          grep -qx '@AGENTS.md' CLAUDE.md
          grep -q '\[Unreleased\]' CHANGELOG.md
          for dir in protocol/schemas roles skills workflows/stages standards bindings driver setup; do
            test -d "$dir" || { echo "missing directory: $dir"; exit 1; }
          done
      - name: Install script dependencies
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Script unit tests
        run: python3 -m unittest discover -s scripts
      - name: Setup unit tests
        run: python3 -m unittest discover -s setup
      - name: Driver unit tests
        run: python3 -m unittest discover -s driver -t .
      - name: Index consistency
        run: python3 scripts/generate_index.py --check
      - name: Conformance validation
        run: python3 scripts/validate_conformance.py
      - name: Standards placeholder integrity
        run: python3 scripts/render_standards.py --check
      - name: Setup smoke install
        # Installs this repository into a scratch project twice. The spot
        # checks prove the first run really installed (hash equality alone
        # would pass on two empty trees); the hash comparison is the
        # idempotency bar — a second run changes nothing.
        run: |
          tmp=$(mktemp -d)
          printf '%s' '{"placeholders":{"PROJECT_NAME":"smoke","TECH_STACK":"Python","ARCHITECTURE_TYPE":"modular monolith"},"commit_format":"conventional","pr_format":"github","ticket_format":"github-issues"}' > "$tmp/setup.json"
          python3 setup/init.py --target "$tmp/project" --config "$tmp/setup.json"
          test -f "$tmp/project/.agents/skills/awf-ground/SKILL.md"
          test -f "$tmp/project/.agents/standards/coding.md"
          test -f "$tmp/project/.agents/awf-install-manifest.json"
          first=$(cd "$tmp/project" && find . -type f -exec sha256sum {} + | sort)
          python3 setup/init.py --target "$tmp/project" --config "$tmp/setup.json"
          second=$(cd "$tmp/project" && find . -type f -exec sha256sum {} + | sort)
          test "$first" = "$second"
